<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <!-- Footstep trail trail curving across page -->
  <g fill="#423328" opacity="0.45">
    <!-- Step 1 Left -->
    <g transform="translate(20, 45) rotate(-15) scale(0.35)">
      <ellipse cx="20" cy="18" rx="14" ry="24"/>
      <ellipse cx="20" cy="54" rx="10" ry="12"/>
    </g>
    <!-- Step 2 Right -->
    <g transform="translate(65, 30) rotate(5) scale(0.35)">
      <ellipse cx="20" cy="18" rx="14" ry="24"/>
      <ellipse cx="20" cy="54" rx="10" ry="12"/>
    </g>
    <!-- Step 3 Left -->
    <g transform="translate(110, 40) rotate(-10) scale(0.35)">
      <ellipse cx="20" cy="18" rx="14" ry="24"/>
      <ellipse cx="20" cy="54" rx="10" ry="12"/>
    </g>
    <!-- Step 4 Right -->
    <g transform="translate(155, 25) rotate(12) scale(0.35)">
      <ellipse cx="20" cy="18" rx="14" ry="24"/>
      <ellipse cx="20" cy="54" rx="10" ry="12"/>
    </g>
    <!-- Step 5 Left -->
    <g transform="translate(205, 35) rotate(-5) scale(0.35)">
      <ellipse cx="20" cy="18" rx="14" ry="24"/>
      <ellipse cx="20" cy="54" rx="10" ry="12"/>
    </g>
    <!-- Step 6 Right -->
    <g transform="translate(255, 20) rotate(18) scale(0.35)">
      <ellipse cx="20" cy="18" rx="14" ry="24"/>
      <ellipse cx="20" cy="54" rx="10" ry="12"/>
    </g>
  </g>
</svg>
