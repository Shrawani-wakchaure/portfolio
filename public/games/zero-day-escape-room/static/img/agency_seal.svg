<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <path id="circlePathOuter" d="M 70,70 m -56,0 a 56,56 0 1,1 112,0 a 56,56 0 1,1 -112,0" />
    <path id="circlePathInner" d="M 70,70 m -44,0 a 44,44 0 1,0 88,0 a 44,44 0 1,0 -88,0" />
  </defs>
  <!-- Outer double ring -->
  <circle cx="70" cy="70" r="66" fill="none" stroke="#7a624f" stroke-width="2.5" stroke-dasharray="8 3" opacity="0.6"/>
  <circle cx="70" cy="70" r="60" fill="none" stroke="#7a624f" stroke-width="1.8" opacity="0.6"/>
  <circle cx="70" cy="70" r="42" fill="none" stroke="#7a624f" stroke-width="1.2" opacity="0.5"/>
  
  <!-- Outer Text -->
  <text font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#7a624f" letter-spacing="2" opacity="0.75">
    <textPath href="#circlePathOuter" startOffset="0%">
      DIGITAL FORENSICS ARCHIVE • CLOUD INCIDENT •
    </textPath>
  </text>
  
  <!-- Center Emblem (Eagle / Shield / Key) -->
  <g transform="translate(42, 42) scale(0.4)" stroke="#7a624f" fill="none" stroke-width="3" opacity="0.7">
    <!-- Shield -->
    <path d="M 70,10 L 120,30 L 120,80 C 120,120 70,140 70,140 C 70,140 20,120 20,80 L 20,30 Z" stroke-width="4"/>
    <!-- Keyhole -->
    <circle cx="70" cy="65" r="14" fill="#7a624f"/>
    <polygon points="63,65 77,65 82,95 58,95" fill="#7a624f"/>
    <!-- Stars -->
    <circle cx="45" cy="40" r="3" fill="#7a624f"/>
    <circle cx="70" cy="30" r="3" fill="#7a624f"/>
    <circle cx="95" cy="40" r="3" fill="#7a624f"/>
  </g>
</svg>
