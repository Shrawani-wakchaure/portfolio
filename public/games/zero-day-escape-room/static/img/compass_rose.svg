<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="sepia-filter">
      <feColorMatrix type="matrix" values="0.6 0 0 0 0.3  0 0.5 0 0 0.2  0 0 0.4 0 0.1  0 0 0 0.45 0" />
    </filter>
  </defs>
  <g transform="translate(100, 100)" stroke="#6a5240" fill="none" opacity="0.6" stroke-width="1.2">
    <!-- Concentric rings -->
    <circle r="92" stroke-width="2"/>
    <circle r="86" stroke-dasharray="2 3"/>
    <circle r="60"/>
    <circle r="25"/>
    <circle r="8" fill="#6a5240"/>
    
    <!-- Degree ticks -->
    <line x1="0" y1="-86" x2="0" y2="-92" stroke-width="2"/>
    <line x1="0" y1="86" x2="0" y2="92" stroke-width="2"/>
    <line x1="-86" y1="0" x2="-92" y2="0" stroke-width="2"/>
    <line x1="86" y1="0" x2="92" y2="0" stroke-width="2"/>
    
    <!-- 8 Points -->
    <!-- North -->
    <polygon points="0,-18 7,-25 0,-85" fill="#6a5240"/>
    <polygon points="0,-18 -7,-25 0,-85" fill="#d9c7a7"/>
    <!-- South -->
    <polygon points="0,18 -7,25 0,85" fill="#6a5240"/>
    <polygon points="0,18 7,25 0,85" fill="#d9c7a7"/>
    <!-- East -->
    <polygon points="18,0 25,7 85,0" fill="#6a5240"/>
    <polygon points="18,0 25,-7 85,0" fill="#d9c7a7"/>
    <!-- West -->
    <polygon points="-18,0 -25,-7 -85,0" fill="#6a5240"/>
    <polygon points="-18,0 -25,7 -85,0" fill="#d9c7a7"/>
    
    <!-- Diagonals -->
    <!-- NE -->
    <polygon points="10,-10 18,-6 60,-60" fill="#6a5240"/>
    <polygon points="10,-10 6,-18 60,-60" fill="#d9c7a7"/>
    <!-- NW -->
    <polygon points="-10,-10 -6,-18 -60,-60" fill="#6a5240"/>
    <polygon points="-10,-10 -18,-6 -60,-60" fill="#d9c7a7"/>
    <!-- SE -->
    <polygon points="10,10 6,18 60,60" fill="#6a5240"/>
    <polygon points="10,10 18,6 60,60" fill="#d9c7a7"/>
    <!-- SW -->
    <polygon points="-10,10 -18,6 -60,60" fill="#6a5240"/>
    <polygon points="-10,10 -6,18 -60,60" fill="#d9c7a7"/>

    <!-- Labels -->
    <text x="0" y="-70" font-family="'Times New Roman', serif" font-weight="bold" font-size="14" fill="#543e2f" text-anchor="middle" dy="4">N</text>
    <text x="0" y="76" font-family="'Times New Roman', serif" font-weight="bold" font-size="12" fill="#543e2f" text-anchor="middle">S</text>
    <text x="74" y="4" font-family="'Times New Roman', serif" font-weight="bold" font-size="12" fill="#543e2f" text-anchor="middle">E</text>
    <text x="-74" y="4" font-family="'Times New Roman', serif" font-weight="bold" font-size="12" fill="#543e2f" text-anchor="middle">W</text>
  </g>
</svg>
